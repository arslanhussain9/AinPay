<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickUPI Embed Demo — External Website Simulation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid #334155;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .price { font-size: 32px; font-weight: 800; color: #10b981; margin-bottom: 24px; }
    .btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
    }
  </style>

  <!-- 1. Include QuickUPI 2-line embed script -->
  <script src="/quickupi.js" data-merchant-key="pk_live_quickupi_arslan"></script>
</head>
<body>

  <div class="card">
    <div style="font-size: 40px; margin-bottom: 12px;">🚀</div>
    <h1>Fullstack Next.js Cohort 2026</h1>
    <p>Simulating an external course landing page using the 2-line QuickUPI checkout embed.</p>
    
    <div class="price">₹1,999.00</div>

    <!-- 2. Declarative Pay Button -->
    <button data-quickupi-pay data-campaign="nextjs-ai-cohort" class="btn">
      Enroll with 0% Fee UPI
    </button>
  </div>

</body>
</html>
